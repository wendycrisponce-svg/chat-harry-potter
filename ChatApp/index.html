<!doctype html>
<html lang="es" data-bs-theme="dark">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Hogwarts Chat</title>

        <!-- Fuentes: Nunito (base) + la fuente de cada personaje para su nombre -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Cinzel:wght@700&family=Cormorant+Garamond:ital,wght@0,700;1,700&family=Baloo+2:wght@700&family=Fredoka:wght@600&family=Marcellus&family=IM+Fell+English&family=Pirata+One&display=swap" rel="stylesheet">

        <!-- Bootstrap 5.3.8 -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

        <!-- Estilos propios -->
        <link href="css/styles.css" rel="stylesheet">
    </head>

    <body>
        <!-- Fondo animado: estrellas + niebla (solo decorativo) -->
        <div class="fondo-magico" aria-hidden="true">
            <div class="estrellas"></div>
            <div class="estrellas capa2"></div>
            <div class="niebla n1"></div>
            <div class="niebla n2"></div>
        </div>

        <div class="chat border-start border-end d-flex flex-column mx-auto">

            <!-- ENCABEZADO: título + menú de usuario + buscador -->
            <header class="app-header vidrio position-relative z-2 shadow-sm bg-body-tertiary bg-opacity-75 border-bottom p-3">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h1 class="app-titulo fs-3 fw-bold mb-0">Hogwarts Chat</h1>

                    <div class="dropdown">
                        <button type="button" class="btn btn-dark btn-sm d-inline-flex align-items-center p-2"
                            data-bs-toggle="dropdown" aria-expanded="false" aria-label="Menú de usuario">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 16 16"
                                fill="currentColor" aria-hidden="true">
                                <path d="M3 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1H3Zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/>
                            </svg>
                        </button>

                        <ul class="dropdown-menu dropdown-menu-end shadow">
                            <li>
                                <a class="dropdown-item d-flex align-items-center gap-2" href="perfil.html">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16"
                                        fill="currentColor" aria-hidden="true"><path d="M3 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1H3Zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/></svg>
                                    Mi perfil
                                </a>
                            </li>
                            <li><hr class="dropdown-divider"></li>
                            <li>
                                <a id="cerrar-sesion" class="dropdown-item d-flex align-items-center gap-2 text-danger-emphasis" href="login.html">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16"
                                        fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M10 12.5a.5.5 0 0 1-.5.5h-8a.5.5 0 0 1-.5-.5v-9a.5.5 0 0 1 .5-.5h8a.5.5 0 0 1 .5.5v2a.5.5 0 0 0 1 0v-2A1.5 1.5 0 0 0 9.5 2h-8A1.5 1.5 0 0 0 0 3.5v9A1.5 1.5 0 0 0 1.5 14h8a1.5 1.5 0 0 0 1.5-1.5v-2a.5.5 0 0 0-1 0z"/><path fill-rule="evenodd" d="M15.854 8.354a.5.5 0 0 0 0-.708l-3-3a.5.5 0 0 0-.708.708L14.293 7.5H5.5a.5.5 0 0 0 0 1h8.793l-2.147 2.146a.5.5 0 0 0 .708.708z"/></svg>
                                    Cerrar sesión
                                </a>
                            </li>
                        </ul>
                    </div>
                </div>

                <input id="buscador" type="search" class="form-control bg-body bg-opacity-75"
                    placeholder="Buscar personaje…" aria-label="Buscar personaje">
            </header>

            <!-- Contenedor vacío: index.js carga los contactos desde /api/contactos -->
            <main class="flex-grow-1 overflow-auto">
                <div id="lista-contactos" class="list-group list-group-flush"></div>

                <p id="sin-resultados" class="text-body-secondary text-center p-4 mb-0 d-none">
                    No encontramos ese personaje.
                </p>
            </main>

        </div>

        <!-- Bootstrap JS -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

        <!-- Scripts en orden -->
        <script src="javaScript/config.js"></script>
        <script src="javaScript/api.js"></script>
        <script src="javaScript/utils.js"></script>
        <script src="javaScript/index.js"></script>
    </body>
</html>
