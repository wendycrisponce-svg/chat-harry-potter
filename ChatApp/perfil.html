<!doctype html>
<html lang="es" data-bs-theme="dark">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Mi perfil · Hogwarts Chat</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Cinzel:wght@700&display=swap" rel="stylesheet">

        <!-- Bootstrap 5.3.8 -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

        <!-- Estilos propios (después de Bootstrap para poder sobrescribir sus variables) -->
        <link href="styles.css" rel="stylesheet">
    </head>

    <body>
        <!-- Fondo animado: estrellas + niebla (solo decorativo) -->
        <div class="fondo-magico" aria-hidden="true">
            <div class="estrellas"></div>
            <div class="estrellas capa2"></div>
            <div class="niebla n1"></div>
            <div class="niebla n2"></div>
        </div>

        <div class="chat border-start border-end d-flex flex-column mx-auto">

            <header class="app-header vidrio position-relative z-2 shadow-sm bg-body-tertiary bg-opacity-75 border-bottom d-flex align-items-center gap-3 p-3">
                <a href="index.html" class="btn btn-dark btn-sm" aria-label="Volver a los contactos">&larr;</a>
                <h1 class="app-titulo fs-4 fw-bold mb-0">Mi perfil</h1>
            </header>

            <main class="flex-grow-1 overflow-auto px-3 py-4">
                <div class="row justify-content-center mx-0">
                    <div class="col-12 col-sm-10 col-md-8">

                        <form id="form-perfil" novalidate>

                            <!-- FOTO: el input de archivo está oculto y se abre con el botón de la cámara -->
                            <div class="text-center mb-4">
                                <div class="position-relative d-inline-block">
                                    <div id="perfil-avatar"
                                        class="avatar-perfil rounded-circle d-flex align-items-center justify-content-center bg-body-secondary text-body-secondary"
                                        role="img" aria-label="Tu foto de perfil">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                                            <path d="M3 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1H3Zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/>
                                        </svg>
                                    </div>
                                    <label for="perfil-foto"
                                        class="btn btn-acento btn-icono rounded-circle position-absolute bottom-0 end-0 p-0 d-flex align-items-center justify-content-center"
                                        title="Cambiar foto">
                                        <span aria-hidden="true">📷</span>
                                        <span class="visually-hidden">Cambiar foto</span>
                                    </label>
                                    <input id="perfil-foto" name="foto" type="file" accept="image/*" class="visually-hidden">
                                </div>
                            </div>

                            <!-- NOMBRE -->
                            <div class="mb-3">
                                <label for="perfil-nombre" class="form-label small fw-semibold text-body-secondary">Nombre</label>
                                <input id="perfil-nombre" name="nombre" type="text" class="form-control"
                                    maxlength="30" autocomplete="off" required>
                                <div class="invalid-feedback">Escribí un nombre.</div>
                            </div>

                            <!-- DESCRIPCIÓN -->
                            <div class="mb-3">
                                <label for="perfil-descripcion" class="form-label small fw-semibold text-body-secondary">Descripción</label>
                                <textarea id="perfil-descripcion" name="descripcion" class="form-control" rows="3" maxlength="100"></textarea>
                                <div class="form-text">Máximo 100 caracteres.</div>
                            </div>

                            <!-- ESTADO -->
                            <fieldset class="mb-4">
                                <legend class="form-label small fw-semibold text-body-secondary float-none">Estado</legend>
                                <div class="d-flex flex-wrap gap-2">
                                    <input type="radio" class="btn-check" name="estado" id="estado-disponible" value="disponible" autocomplete="off" checked>
                                    <label class="btn btn-outline-secondary btn-estado" for="estado-disponible" data-estado="disponible">Disponible</label>

                                    <input type="radio" class="btn-check" name="estado" id="estado-ocupado" value="ocupado" autocomplete="off">
                                    <label class="btn btn-outline-secondary btn-estado" for="estado-ocupado" data-estado="ocupado">Ocupado</label>

                                    <input type="radio" class="btn-check" name="estado" id="estado-no-molestar" value="no-molestar" autocomplete="off">
                                    <label class="btn btn-outline-secondary btn-estado" for="estado-no-molestar" data-estado="no-molestar">No molestar</label>
                                </div>
                            </fieldset>

                            <button type="submit" class="btn btn-acento w-100">Guardar cambios</button>

                            <!-- Confirmación: el JS le quita la clase d-none al guardar -->
                            <p id="perfil-guardado" class="text-success small text-center mt-2 mb-0 d-none" role="status">Cambios guardados</p>

                        </form>

                    </div>
                </div>
            </main>

        </div>
        <!-- <script src="perfil.js"></script> -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
