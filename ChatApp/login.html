<!doctype html>
<html lang="es" data-bs-theme="dark">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Iniciar sesión · Hogwarts Chat</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Cinzel:wght@700&display=swap" rel="stylesheet">

        <!-- Bootstrap 5.3.8 -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

        <!-- Estilos propios -->
        <link href="estilos.css" rel="stylesheet">
    </head>

    <body>
        <!-- Fondo animado: estrellas + niebla (solo decorativo) -->
        <div class="fondo-magico" aria-hidden="true">
            <div class="estrellas"></div>
            <div class="estrellas capa2"></div>
            <div class="niebla n1"></div>
            <div class="niebla n2"></div>
        </div>

        <!-- Grilla de Bootstrap: la tarjeta ocupa todo el ancho en celular y se angosta en pantallas grandes -->
        <main class="container min-vh-100 d-flex align-items-center justify-content-center py-4">
            <div class="row justify-content-center w-100 mx-0">
                <div class="col-12 col-sm-9 col-md-6 col-lg-5 col-xl-4">

                    <div class="card vidrio aparecer rounded-4 shadow-lg bg-body-tertiary bg-opacity-75 border-warning border-opacity-25">
                        <div class="card-body p-4 p-sm-5">
                            <h1 class="app-titulo fs-2 fw-bold text-center mb-1">Hogwarts Chat</h1>
                            <p class="text-body-secondary text-center mb-4">Iniciá sesión para empezar a chatear</p>

                            <!-- No hay registro: existe un único usuario.
                                El JS valida, agrega la clase "was-validated" al form y redirige a index.html -->
                            <form id="form-login" novalidate>
                                <div class="form-floating mb-3">
                                    <input id="login-usuario" name="usuario" type="text" class="form-control"
                                        placeholder="Usuario" autocomplete="username" required>
                                    <label for="login-usuario">Usuario</label>
                                    <div class="invalid-feedback">Ingresá tu usuario.</div>
                                </div>

                                <div class="form-floating mb-3">
                                    <input id="login-clave" name="clave" type="password" class="form-control"
                                        placeholder="Contraseña" autocomplete="current-password" required>
                                    <label for="login-clave">Contraseña</label>
                                    <div class="invalid-feedback">Ingresá tu contraseña.</div>
                                </div>

                                <!-- Error de credenciales: el JS le quita la clase d-none y completa el texto -->
                                <div id="login-error" class="alert alert-danger py-2 small d-none" role="alert"></div>

                                <button type="submit" class="btn btn-acento btn-lg w-100">Entrar</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        <!-- <script src="login.js"></script> -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
